<!doctype html>
<!--
  LinkedIn architecture HERO template (square 1080x1080).
  HOW TO USE:
    1. Copy this file. Edit the TITLE, the numbered BANDS, the SIDE LOOP, and the FOOTER.
    2. Render to PNG at 2x:
       CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
       "$CHROME" --headless=new --hide-scrollbars --disable-gpu \
         --force-device-scale-factor=2 --window-size=1080,1080 \
         --default-background-color=00000000 --screenshot=out.png "file://$PWD/hero-template.html"
    3. Read out.png to verify (no overflow / typos), then post.
  For a LANDSCAPE version: set svg width/height + viewBox to 1200x870 and window-size to 1200,870,
  and widen the layout. Keep text concise so nothing overflows.
  Palette: bg #0A1120 · panels #101A2C/#0E1726 · border #22324C · ink #EAF1FA · muted #8FA1BC
           green #34D399 (build) · blue #1B96FF / cyan #38BDF8 (core) · purple #A78BFA (loop)
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#0A1120;}
  svg{display:block;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .eyebrow{fill:#38BDF8;font-size:15px;font-weight:700;letter-spacing:3px;}
  .title{fill:#EAF1FA;font-size:33px;font-weight:800;}
  .subtitle{fill:#9DB0CC;font-size:15px;font-weight:500;}
  .bandlabel{fill:#7E92B2;font-size:12.5px;font-weight:700;letter-spacing:2px;}
  .cardtitle{fill:#EAF1FA;font-size:19px;font-weight:700;}
  .body{fill:#C2CFE4;font-size:14px;font-weight:500;}
  .muted{fill:#8497B5;font-size:12px;font-weight:500;}
  .mono{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:13px;font-weight:600;}
  .chip{fill:#C9D6EC;font-size:12.5px;font-weight:600;}
  .arrowlbl{fill:#7E92B2;font-size:12px;font-weight:600;font-style:italic;}
  .footer{fill:#9DB0CC;font-size:14px;font-weight:600;}
  .tag{fill:#0A1120;font-size:12.5px;font-weight:800;letter-spacing:1px;}
</style>
</head>
<body>
<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1120"/><stop offset="1" stop-color="#0C1424"/>
    </linearGradient>
    <linearGradient id="accentbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#1B96FF"/>
    </linearGradient>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#46618C"/></marker>
    <marker id="arwP" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#A78BFA"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- ===== TITLE (edit) ===== -->
  <text x="44" y="86"  class="eyebrow">EYEBROW · CONTEXT TAG</text>
  <text x="44" y="130" class="title">Your Bold Title Goes Here</text>
  <text x="44" y="160" class="subtitle">One-line subtitle — the promise / the differentiator in plain words</text>

  <!-- ===== BAND 1 (edit): two cards + a chip row ===== -->
  <rect x="44" y="200" width="636" height="280" rx="16" fill="#101A2C" stroke="#22324C" filter="url(#sh)"/>
  <text x="64" y="230" class="bandlabel">1 · FIRST LAYER</text>

  <rect x="64" y="242" width="286" height="150" rx="12" fill="#0E1726" stroke="#243650"/>
  <rect x="64" y="242" width="6" height="150" rx="3" fill="#34D399"/>
  <text x="84" y="276" class="cardtitle">Card A title</text>
  <rect x="84" y="288" width="180" height="26" rx="6" fill="#10241C" stroke="#1E5C43"/>
  <text x="94" y="306" class="mono" fill="#5EEAD4">/identifier-or-command</text>
  <text x="84" y="338" class="body">One-line description that</text>
  <text x="84" y="358" class="body">wraps to two or three short</text>
  <text x="84" y="378" class="body">lines inside the card.</text>

  <rect x="366" y="242" width="286" height="150" rx="12" fill="#0E1726" stroke="#243650"/>
  <rect x="366" y="242" width="6" height="150" rx="3" fill="#1B96FF"/>
  <text x="386" y="276" class="cardtitle">Card B title</text>
  <rect x="386" y="288" width="194" height="26" rx="6" fill="#0E1F33" stroke="#1B4870"/>
  <text x="396" y="306" class="mono" fill="#7CC4FF">/identifier-or-command</text>
  <text x="386" y="338" class="body">Second card description,</text>
  <text x="386" y="358" class="body">kept short so it never</text>
  <text x="386" y="378" class="body">overflows the box.</text>

  <text x="64" y="418" class="muted">SUPPORTING CHIPS (skills / parts / steps)</text>
  <rect x="64"  y="428" width="104" height="32" rx="16" fill="#13233A" stroke="#274063"/><text x="116" y="449" class="chip" text-anchor="middle">chip one</text>
  <rect x="178" y="428" width="88"  height="32" rx="16" fill="#13233A" stroke="#274063"/><text x="222" y="449" class="chip" text-anchor="middle">chip 2</text>
  <rect x="276" y="428" width="112" height="32" rx="16" fill="#13233A" stroke="#274063"/><text x="332" y="449" class="chip" text-anchor="middle">chip three</text>
  <rect x="398" y="428" width="92"  height="32" rx="16" fill="#13233A" stroke="#274063"/><text x="444" y="449" class="chip" text-anchor="middle">chip 4</text>
  <rect x="500" y="428" width="160" height="32" rx="16" fill="#171426" stroke="#3A2F63"/><text x="580" y="449" class="chip" fill="#C9BBF2" text-anchor="middle">extra · +N</text>

  <line x1="362" y1="480" x2="362" y2="512" stroke="#46618C" stroke-width="2" marker-end="url(#arw)"/>
  <text x="374" y="503" class="arrowlbl">transition label</text>

  <!-- ===== BAND 2 (edit): two sub-panels of items ===== -->
  <rect x="44" y="516" width="636" height="244" rx="16" fill="#101A2C" stroke="#22324C" filter="url(#sh)"/>
  <text x="64" y="546" class="bandlabel">2 · SECOND LAYER</text>

  <rect x="64" y="560" width="184" height="184" rx="12" fill="#0E1726" stroke="#243650"/>
  <text x="80" y="586" class="muted" fill="#9DB0CC">GROUP A</text>
  <rect x="80" y="598" width="152" height="40" rx="8" fill="#13233A" stroke="#274063"/><text x="92" y="623" class="mono" fill="#9FD0FF">item one</text>
  <rect x="80" y="648" width="152" height="40" rx="8" fill="#13233A" stroke="#274063"/><text x="92" y="673" class="mono" fill="#9FD0FF">item two</text>

  <rect x="264" y="560" width="416" height="184" rx="12" fill="#0E1726" stroke="#243650"/>
  <text x="280" y="586" class="muted" fill="#9DB0CC">GROUP B</text>
  <rect x="280" y="596" width="186" height="32" rx="8" fill="#13233A" stroke="#274063"/><text x="292" y="617" class="mono" fill="#A9C7EA">item three</text>
  <rect x="476" y="596" width="194" height="32" rx="8" fill="#13233A" stroke="#274063"/><text x="488" y="617" class="mono" fill="#A9C7EA">item four</text>
  <rect x="280" y="636" width="186" height="32" rx="8" fill="#13233A" stroke="#274063"/><text x="292" y="657" class="mono" fill="#A9C7EA">item five</text>
  <rect x="476" y="636" width="194" height="32" rx="8" fill="#13233A" stroke="#274063"/><text x="488" y="657" class="mono" fill="#A9C7EA">item six</text>
  <rect x="280" y="676" width="390" height="32" rx="8" fill="#101D18" stroke="#1E5C43"/><text x="292" y="697" class="mono" fill="#7FE3CF">highlighted item</text>

  <line x1="362" y1="760" x2="362" y2="792" stroke="#46618C" stroke-width="2" marker-end="url(#arw)"/>
  <text x="374" y="783" class="arrowlbl">transition label</text>

  <!-- ===== BAND 3 (edit): the destination / outcome bar ===== -->
  <rect x="44" y="796" width="636" height="84" rx="16" fill="#0E1B2E" stroke="#1F4E7A" filter="url(#sh)"/>
  <circle cx="90" cy="838" r="17" fill="#0E2236" stroke="#1B96FF"/>
  <text x="90" y="844" font-size="16" text-anchor="middle" fill="#7CC4FF" font-weight="800">✦</text>
  <text x="124" y="832" class="cardtitle">Outcome / destination line</text>
  <text x="124" y="856" class="muted">A short clause describing what happens here</text>

  <!-- ===== SIDE LOOP (edit): feedback / differentiator column ===== -->
  <rect x="700" y="200" width="336" height="680" rx="16" fill="#13102A" stroke="#3A2F63" filter="url(#sh)"/>
  <text x="720" y="238" class="bandlabel" fill="#B7A6F0">⟳ THE LOOP / DIFFERENTIATOR</text>
  <text x="720" y="264" class="muted" fill="#9A8FC4">One-line description of the loop</text>

  <rect x="720" y="284" width="296" height="64" rx="10" fill="#1A1636" stroke="#403468"/>
  <text x="736" y="312" class="mono" fill="#C9BBF2">/step-one</text>
  <text x="736" y="334" class="muted" fill="#9A8FC4">detail for step one</text>
  <line x1="868" y1="348" x2="868" y2="372" stroke="#A78BFA" stroke-width="2" marker-end="url(#arwP)"/>

  <rect x="720" y="374" width="296" height="54" rx="10" fill="#1A1636" stroke="#403468"/>
  <text x="736" y="407" class="body" fill="#D6CCF5">Step two</text>
  <line x1="868" y1="428" x2="868" y2="452" stroke="#A78BFA" stroke-width="2" marker-end="url(#arwP)"/>

  <rect x="720" y="454" width="296" height="64" rx="10" fill="#1A1636" stroke="#403468"/>
  <text x="736" y="482" class="body" fill="#D6CCF5">Step three</text>
  <text x="736" y="504" class="muted" fill="#9A8FC4">detail for step three</text>
  <line x1="868" y1="518" x2="868" y2="542" stroke="#A78BFA" stroke-width="2" marker-end="url(#arwP)"/>

  <rect x="720" y="544" width="296" height="54" rx="10" fill="#1A1636" stroke="#403468"/>
  <text x="736" y="577" class="body" fill="#D6CCF5">Step four</text>

  <rect x="720" y="618" width="296" height="92" rx="10" fill="#0F1726" stroke="#2A2350"/>
  <text x="736" y="644" class="muted" fill="#9A8FC4">KEY CONTRACT / NOTE</text>
  <text x="736" y="670" class="mono" fill="#8FB7E8">field · field ·</text>
  <text x="736" y="692" class="mono" fill="#8FB7E8">field · field</text>

  <!-- feedback dashed arrow back into band 1 -->
  <path d="M720,742 C600,752 530,540 472,462" fill="none" stroke="#A78BFA" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arwP)" opacity="0.9"/>
  <text x="556" y="752" class="arrowlbl" fill="#A78BFA">feeds back →</text>

  <!-- ===== FOOTER (edit): proof + method tag ===== -->
  <rect x="44" y="916" width="470" height="44" rx="22" fill="#0E1726" stroke="#243650"/>
  <text x="70" y="944" class="footer">proof · proof · proof · CI green</text>
  <rect x="770" y="916" width="266" height="44" rx="10" fill="url(#accentbar)"/>
  <text x="903" y="944" class="tag" text-anchor="middle">METHOD: ONE-LINE TAG</text>
</svg>
</body>
</html>
